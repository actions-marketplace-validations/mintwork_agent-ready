# .github/workflows/agent-ready.yml — fail PRs that make the repo harder for AI agents to work in.
name: agent-ready

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes agent-ready@latest . --min-score 75
